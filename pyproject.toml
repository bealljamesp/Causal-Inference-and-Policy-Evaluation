[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "census_engine"
version = "0.1.0"
description = "Causal Inference & Policy Evaluation Engine via USCB API"
authors = [{ name = "James Beall", email = "BeallJamesP@gmail.com" }]
requires-python = ">=3.12"

dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
